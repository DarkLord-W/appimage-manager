name: CI

# 每次 push 与 PR 都跑。三道闸门依次是：编译、引擎自测、界面自动化。
# 任何一道失败就不往下走 —— 界面测试依赖编译产物，产物坏了测它没意义。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支的新 push 会取消正在跑的旧 run，避免排队堆积。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 编译 + 自测 + 界面自动化
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 编译依赖：valac 需要 gtk+-3.0 / json-glib 的开发包。
      #   valac               Vala 编译器
      #   libgtk-3-dev        GTK3 头文件与库
      #   libjson-glib-dev    json-glib（引擎的事务日志用它）
      #   desktop-file-utils  desktop-file-validate（自测与界面测试都要）
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            valac \
            libgtk-3-dev \
            libjson-glib-dev \
            desktop-file-utils

      # 编译。-Werror 不加：valac 生成 C 时对本项目合法的写法也会报
      # 警告（例如 Gtk.Buildable 的过时注解），当成错误会让流水线无意义地红。
      - name: 编译
        run: |
          make 2>&1 | tee build.log
          test "$(grep -c 'error:' build.log)" -eq 0 || {
            echo "::error::编译失败"
            grep -B2 -A4 'error:' build.log | head -60
            exit 1
          }
          ls -la appimage-manager

      - name: 引擎自测
        # 排除 GUI 文件，只测核心引擎。不依赖 X，能跑在任何 runner 上。
        run: make selftest

      # 生成测试夹具：假 AppImage + 21 个畸形 .desktop。
      # 自测和界面测试都要用，放在这一步产出一次。
      - name: 生成测试夹具
        run: |
          tests/make-fixtures.sh
          echo "AppImage 夹具: $(ls /tmp/appmgr-fixtures/apps 2>/dev/null | wc -l) 个"
          echo ".desktop 夹具: $(find /tmp/appmgr-fixtures -name '*.desktop' | wc -l) 个"

      # 界面自动化测试。工具缺失时 ui-test.sh 自己会 SKIP 并退 0，
      # 所以这里先装齐 —— 装了它就真的会跑，而不是静默跳过。
      #
      #   xvfb          虚拟 X server（真机没有 X）
      #   xfwm4         窗口管理器。没有它 GTK 窗口拿不到装饰，
      #                  最大化、右键菜单这类交互全部测不了
      #   xdotool       模拟键鼠
      #   imagemagick   import（截图）与 identify（像素检查）
      #   xclip         剪贴板（部分用例要用）
      - name: 安装界面测试依赖
        run: |
          sudo apt-get install -y --no-install-recommends \
            xvfb xfwm4 xdotool imagemagick xclip

      - name: 界面自动化测试
        run: |
          bash tests/ui-test.sh "${{ github.workspace }}/ui-test-out"

      # 界面测试失败时截图就在这里。没这一步，失败只能看到一行日志，
      # 还得本地复现一遍才知道长什么样 —— 这是 UI 测试最常见的翻车方式。
      - name: 上传界面测试截图（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-screenshots
          path: ui-test-out/
          retention-days: 14
          if-no-files-found: ignore

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

  package-check:
    name: 打包可用性（不发布）
    # 确认三个发行版的包在每次 push 上都还能构建出来。
    # 真发布只在 release.yml（打 tag 时）发生 —— 这里纯粹是提前发现
    # 「nfpm 配置坏了 / make install 的路径变了」这类问题，
    # 不然要等打 tag 才发现包构建不出来。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            valac libgtk-3-dev libjson-glib-dev

      - name: 编译
        run: make

      - name: 安装 nfpm
        run: |
          NFPM_URL=https://nfpm.goreleaser.com/static/nfpm-2.41.0_linux_amd64.tar.gz
          curl -sSL "$NFPM_URL" | tar -xz -C /tmp nfpm
          /tmp/nfpm --version

      - name: 构建 deb / rpm / arch
        working-directory: packaging
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/pkgtest"

          # .desktop 里有 @PREFIX@ 占位符要由 sed 替换，而 nfpm 不做替换。
          # 必须先用 make install 暂存，nfpm.yaml 的 src 指向那份产物。
          make install DESTDIR=build/pkg PREFIX=/usr >/dev/null

          # --packager 会跑 nfpm.yaml 里配置的 postinstall 之类脚本吗？
          # 不会 —— 那些只在真正安装时执行。这里只验证「能不能打出包」。
          # 注意 archlinux 不是 arch，写 arch 会直接报 packager 不存在。
          /tmp/nfpm package \
            --config nfpm.yaml \
            --packager deb \
            --target "${{ github.workspace }}/pkgtest"
          /tmp/nfpm package \
            --config nfpm.yaml \
            --packager rpm \
            --target "${{ github.workspace }}/pkgtest"
          /tmp/nfpm package \
            --config nfpm.yaml \
            --packager archlinux \
            --target "${{ github.workspace }}/pkgtest"
          ls -la "${{ github.workspace }}/pkgtest"

      - name: 上传包（供人工检查）
        uses: actions/upload-artifact@v4
        with:
          name: packages-untagged
          path: pkgtest/
          retention-days: 7
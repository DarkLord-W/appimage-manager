name: CI

# 每次 push 与 PR 都跑：编译 + 253 项引擎自测 + 打包可用性检查。
#
# 为什么**不**在这里跑界面自动化：
#
#   1. 时间对不上。那个 21 步套件本地实测要 55 分钟以上，而这里的
#      timeout-minutes 只有 15 —— 它会在 CI 上被超时杀掉，然后报一个
#      跟代码毫无关系的红。把超时调到 1 小时只是把问题藏起来：
#      push 一次要等一小时才有反馈。
#
#   2. 这类测试天生脆。它靠像素扫描数行数/数菜单项、硬编码坐标、
#      大量 sleep 与重试。光是这一轮开发就修了三处标定过期：
#      操作条按钮坐标（emoji 标签换成图标后整排位移）、亮度阈值 55%
#      （禁用项的灰字被漏数）、「关于」标题（GTK 翻译生效后变中文）。
#      每改一次界面都可能要重新标定 —— 当门禁会把发布卡在无关的事情上。
#
#   3. 它挡不住的问题，引擎自测基本都能挡。真正只有界面测试能发现的
#      （比如按钮点了没反应），值得单独跑一次，不值得每次 push 都跑。
#
# 界面测试挪到了 ui-test.yml：手动触发 + 每周定时一次，失败不影响任何东西。
# 发布流程（release.yml）里跑的是产物验证 —— 那验的是「AppImage 能不能
# 解开并运行、deb 的 Depends 对不对、版本号与 tag 是否一致」，是发布的门槛，
# 跟这里的测试不是一回事。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支的新 push 会取消正在跑的旧 run，避免排队堆积。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 编译 + 引擎自测
    runs-on: ubuntu-latest
    # 实测这套跑完不到 2 分钟（含 apt），15 分钟留了很宽的余量。
    # 真超时说明是别的问题（比如 apt 源挂了），不是任务本身慢。
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 编译依赖：valac 需要 gtk+-3.0 / json-glib 的开发包。
      #   valac               Vala 编译器
      #   libgtk-3-dev        GTK3 头文件与库
      #   libjson-glib-dev    json-glib（引擎的事务日志用它）
      #   desktop-file-utils  desktop-file-validate（自测里校验生成的 .desktop）
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            valac \
            libgtk-3-dev \
            libjson-glib-dev \
            desktop-file-utils

      # 编译。-Werror 不加：valac 生成 C 时对本项目合法的写法也会报
      # 警告（例如 Gtk.Buildable 的过时注解），当成错误会让流水线无意义地红。
      - name: 编译
        run: |
          make 2>&1 | tee build.log
          test "$(grep -c 'error:' build.log)" -eq 0 || {
            echo "::error::编译失败"
            grep -B2 -A4 'error:' build.log | head -60
            exit 1
          }
          ls -la appimage-manager

      # 夹具由 make selftest 按需自动生成（Makefile 里有兜底），
      # 所以这里不用单独跑一行 make-fixtures.sh。
      - name: 引擎自测
        # 只测核心引擎，不含 GUI 文件。不依赖 X，能跑在任何 runner 上，
        # 也不依赖任何图形工具 —— 这里跑的 253 项就是全量。
        run: make selftest

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

  aur-check:
    name: AUR 打包文件校验
    # 在真的 Arch 环境里跑，因为要用的两个工具只有 Arch 有：
    #   makepkg --printsrcinfo  .SRCINFO 的权威生成方式
    #   namcap                  PKGBUILD 的规范检查
    #
    # 存在的意义：本项目的 .SRCINFO 是 scripts/gen-srcinfo.sh 生成的
    # （开发机不是 Arch，没有 makepkg）。那个脚本只要格式差一个空格或
    # 少一个字段，AUR 就会拒收 —— 而这种事只有真跑一遍 makepkg 才知道。
    # 所以这里拿两边的输出做逐字节对比。
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    timeout-minutes: 20

    steps:
      - name: 安装依赖
        run: |
          pacman -Syu --noconfirm --needed git namcap

      - uses: actions/checkout@v4

      - name: 用真 makepkg 生成 .SRCINFO 并比对
        run: |
          set -euo pipefail

          # makepkg 拒绝以 root 运行（怕把系统搞坏），所以建个普通用户。
          # 容器里默认就是 root，不建的话这步会直接报
          # "Running makepkg as root is not allowed"。
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

          # 两个包都要验。appimage-manager-bin 的 PKGBUILD 里 sha256sums
          # 是全零占位符（真值由 publish-aur.sh 在推送前填），不影响这里 ——
          # --printsrcinfo 只解析 PKGBUILD，不下载任何东西。
          rc=0
          for dir in packaging/aur packaging/aur-bin; do
            echo "════ $dir ════"

            su builder -c "cd '$GITHUB_WORKSPACE/$dir' && makepkg --printsrcinfo" \
                > /tmp/real.SRCINFO

            if ! diff -u "$dir/.SRCINFO" /tmp/real.SRCINFO; then
              echo "::error::$dir/.SRCINFO 与 makepkg 的输出不一致。"
              echo "::error::跑这个重新生成再提交："
              echo "::error::  scripts/gen-srcinfo.sh $dir/PKGBUILD > $dir/.SRCINFO"
              rc=1
            else
              echo "✓ $dir/.SRCINFO 与 makepkg 的输出逐字节一致"
            fi
          done
          exit $rc

      - name: namcap 检查
        run: |
          set -euo pipefail
          # namcap 的退出码是 0/1/2 分别对应不同级别的问题，
          # 但 PKGBUILD 模式下它把发现的问题打到 stderr。
          # 这里只做「有输出就展示」，不让它把构建卡住 ——
          # 真正该拦的是 .SRCINFO 不一致，那个在上面已经拦了。
          for dir in packaging/aur packaging/aur-bin; do
            echo "════ $dir ════"
            su builder -c "cd '$GITHUB_WORKSPACE/$dir' && namcap PKGBUILD" || true
          done

  package-check:
    name: 打包可用性（不发布）
    # 确认三个发行版的包在每次 push 上都还能构建出来。
    # 真发布只在 release.yml（打 tag 时）发生 —— 这里纯粹是提前发现
    # 「nfpm 配置坏了 / make install 的路径变了」这类问题，
    # 不然要等打 tag 才发现包构建不出来。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            valac libgtk-3-dev libjson-glib-dev

      - name: 编译
        run: make

      - name: 安装 nfpm
        run: |
          set -euo pipefail

          # nfpm 只发布在 GitHub Releases 上，没有 apt 包。
          #
          # URL 里的大小写是有讲究的：资产名是 nfpm_<版本>_Linux_x86_64.tar.gz
          # （大写 L、大写 X）。老工作流用的是
          #   https://nfpm.goreleaser.com/static/nfpm-2.41.0_linux_amd64.tar.gz
          # 那个 GoReleaser static 托管早就下线了，现在返回 404 的 HTML 页面。
          #
          # 所以下面第一件事是给 curl 加 -f（遇 4xx/5xx 直接失败）。
          # 少了它，404 的 HTML 会顺着管道喂给 tar，报出来的是
          # 「gzip: stdin: not in gzip format」——指错方向的错误信息，
          # 真正的原因（URL 404 了）反而看不见。
          V=2.47.0
          URL="https://github.com/goreleaser/nfpm/releases/download/v${V}/nfpm_${V}_Linux_x86_64.tar.gz"
          curl -fsSL -o /tmp/nfpm.tar.gz "$URL"

          # 解压前先确认拿到的是 gzip。URL 万一再变，这里能立刻说清原因，
          # 而不是让失败出现在后面几步的打包命令里。
          file /tmp/nfpm.tar.gz | grep -q 'gzip compressed data' || {
            echo "::error::下载到的不是 gzip，URL 可能又变了：$URL"
            head -c 200 /tmp/nfpm.tar.gz
            exit 1
          }

          tar xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          chmod +x /tmp/nfpm
          # 真跑一次：架构不对、解出来是个空壳，都在这里拦住
          /tmp/nfpm --version

      # 暂存安装树。**必须在仓库根跑** —— Makefile 在这儿，
      # 而且 nfpm.yaml 里的 src 是 ../build/pkg/...，从 packaging/ 解析
      # 正好指到 <仓库根>/build/pkg。packaging/ 里没有 Makefile，
      # 在那跑 make install 只会报 "No rule to make target 'install'" 然后空转。
      - name: 暂存安装树（替换 @PREFIX@）
        # .desktop 里有 @PREFIX@ 占位符要由 sed 替换，而 nfpm 不做替换，
        # 所以先 make install 出一份替换好的暂存树给 nfpm 吃。
        run: make install DESTDIR=build/pkg PREFIX=/usr

      - name: 构建 deb / rpm / arch
        working-directory: packaging
        run: |
          set -euo pipefail
          OUT="${{ github.workspace }}/pkgtest"
          mkdir -p "$OUT"

          # 注意工作目录是 packaging/（而不是仓库根）：nfpm.yaml 的
          # contents.src 与 scripts.* 都是**相对当前工作目录**解析的。
          #
          # --packager 不会执行 nfpm.yaml 里配置的 postinstall 之类脚本 ——
          # 那些只在真正安装时跑。这里只验证「能不能打出包」。
          # 注意 archlinux 不是 arch，写 arch 会直接报 packager 不存在。
          for f in deb rpm archlinux; do
            echo "── $f ──"
            /tmp/nfpm package --config nfpm.yaml --packager "$f" --target "$OUT"
          done
          ls -la "$OUT"

      - name: 上传包（供人工检查）
        uses: actions/upload-artifact@v4
        with:
          name: packages-untagged
          path: pkgtest/
          retention-days: 7

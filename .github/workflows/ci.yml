name: CI

# 每次 push 与 PR 都跑：编译 + 253 项引擎自测 + 打包可用性检查。
#
# 为什么**不**在这里跑界面自动化：
#
#   1. 时间对不上。那个 21 步套件本地实测要 55 分钟以上，而这里的
#      timeout-minutes 只有 15 —— 它会在 CI 上被超时杀掉，然后报一个
#      跟代码毫无关系的红。把超时调到 1 小时只是把问题藏起来：
#      push 一次要等一小时才有反馈。
#
#   2. 这类测试天生脆。它靠像素扫描数行数/数菜单项、硬编码坐标、
#      大量 sleep 与重试。光是这一轮开发就修了三处标定过期：
#      操作条按钮坐标（emoji 标签换成图标后整排位移）、亮度阈值 55%
#      （禁用项的灰字被漏数）、「关于」标题（GTK 翻译生效后变中文）。
#      每改一次界面都可能要重新标定 —— 当门禁会把发布卡在无关的事情上。
#
#   3. 它挡不住的问题，引擎自测基本都能挡。真正只有界面测试能发现的
#      （比如按钮点了没反应），值得单独跑一次，不值得每次 push 都跑。
#
# 界面测试挪到了 ui-test.yml：手动触发 + 每周定时一次，失败不影响任何东西。
# 发布流程（release.yml）里跑的是产物验证 —— 那验的是「AppImage 能不能
# 解开并运行、deb 的 Depends 对不对、版本号与 tag 是否一致」，是发布的门槛，
# 跟这里的测试不是一回事。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# 同一分支的新 push 会取消正在跑的旧 run，避免排队堆积。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 编译 + 引擎自测
    runs-on: ubuntu-latest
    # 实测这套跑完不到 2 分钟（含 apt），15 分钟留了很宽的余量。
    # 真超时说明是别的问题（比如 apt 源挂了），不是任务本身慢。
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 编译依赖：valac 需要 gtk+-3.0 / json-glib 的开发包。
      #   valac               Vala 编译器
      #   libgtk-3-dev        GTK3 头文件与库
      #   libjson-glib-dev    json-glib（引擎的事务日志用它）
      #   desktop-file-utils  desktop-file-validate（自测里校验生成的 .desktop）
      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            valac \
            libgtk-3-dev \
            libjson-glib-dev \
            desktop-file-utils

      # 编译。-Werror 不加：valac 生成 C 时对本项目合法的写法也会报
      # 警告（例如 Gtk.Buildable 的过时注解），当成错误会让流水线无意义地红。
      - name: 编译
        run: |
          make 2>&1 | tee build.log
          test "$(grep -c 'error:' build.log)" -eq 0 || {
            echo "::error::编译失败"
            grep -B2 -A4 'error:' build.log | head -60
            exit 1
          }
          ls -la appimage-manager

      # 夹具由 make selftest 按需自动生成（Makefile 里有兜底），
      # 所以这里不用单独跑一行 make-fixtures.sh。
      - name: 引擎自测
        # 只测核心引擎，不含 GUI 文件。不依赖 X，能跑在任何 runner 上，
        # 也不依赖任何图形工具 —— 这里跑的 253 项就是全量。
        run: make selftest

      - name: 上传编译日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

  package-check:
    name: 打包可用性（不发布）
    # 确认三个发行版的包在每次 push 上都还能构建出来。
    # 真发布只在 release.yml（打 tag 时）发生 —— 这里纯粹是提前发现
    # 「nfpm 配置坏了 / make install 的路径变了」这类问题，
    # 不然要等打 tag 才发现包构建不出来。
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            valac libgtk-3-dev libjson-glib-dev

      - name: 编译
        run: make

      - name: 安装 nfpm
        run: |
          NFPM_URL=https://nfpm.goreleaser.com/static/nfpm-2.41.0_linux_amd64.tar.gz
          curl -sSL "$NFPM_URL" | tar -xz -C /tmp nfpm
          /tmp/nfpm --version

      - name: 构建 deb / rpm / arch
        working-directory: packaging
        run: |
          set -euo pipefail
          mkdir -p "${{ github.workspace }}/pkgtest"

          # .desktop 里有 @PREFIX@ 占位符要由 sed 替换，而 nfpm 不做替换。
          # 必须先用 make install 暂存，nfpm.yaml 的 src 指向那份产物。
          make install DESTDIR=build/pkg PREFIX=/usr >/dev/null

          # --packager 会跑 nfpm.yaml 里配置的 postinstall 之类脚本吗？
          # 不会 —— 那些只在真正安装时执行。这里只验证「能不能打出包」。
          # 注意 archlinux 不是 arch，写 arch 会直接报 packager 不存在。
          /tmp/nfpm package \
            --config nfpm.yaml \
            --packager deb \
            --target "${{ github.workspace }}/pkgtest"
          /tmp/nfpm package \
            --config nfpm.yaml \
            --packager rpm \
            --target "${{ github.workspace }}/pkgtest"
          /tmp/nfpm package \
            --config nfpm.yaml \
            --packager archlinux \
            --target "${{ github.workspace }}/pkgtest"
          ls -la "${{ github.workspace }}/pkgtest"

      - name: 上传包（供人工检查）
        uses: actions/upload-artifact@v4
        with:
          name: packages-untagged
          path: pkgtest/
          retention-days: 7

name: build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-ubuntu:
    name: Build (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y valac libgtk-3-dev libjson-glib-dev pkg-config

      - name: 显示工具链版本
        run: |
          valac --version
          pkg-config --modversion gtk+-3.0

      - name: 编译
        run: make -j"$(nproc)"

      - name: 校验产物
        run: |
          test -x ./appimage-manager
          file ./appimage-manager
          ldd ./appimage-manager

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: appimage-manager-ubuntu
          path: appimage-manager

  build-vale:
    name: Vala 静态检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y valac libgtk-3-dev libjson-glib-dev pkg-config

      - name: 只生成 C 代码，验证类型检查通过
        run: |
          valac --pkg gtk+-3.0 \
                --pkg gdk-pixbuf-2.0 \
                --pkg gio-2.0 \
                --pkg json-glib-1.0 \
                --target-glib=2.76 \
                -C src/*.vala
          echo "Vala 类型检查通过"

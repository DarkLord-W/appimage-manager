name: Release

# 只在打 tag 时跑。产出七种资产并挂到 GitHub Release：
#   · AppImage        免安装，双击即用
#   · 原生二进制+数据 tar.gz   解压即用，不需要 root
#   · deb             Debian / Ubuntu / Kali / Mint
#   · rpm             Fedora / RHEL / openSUSE
#   · pkg.tar.zst     Arch / Manjaro
#   · src.tar.gz      源码（发行版打包者用，GPL 对应源码）
#   · SHA256SUMS      校验和
#   · README-install.txt
#
# 几个容易出错的点，代码里都有对应断言挡着：
#   · nfpm 配置里的 version 是写死的，必须从 tag 生成临时配置；
#     并且打完包要从包里**读回**版本号核对（只改不验，下次照样能错回去）
#   · 源码包要能真的解开并编译成功，不是打个 tar 就完事
#   · 每个二进制包都要解开看结构，deb 的 Depends 还要逐库比对
#
# 版本号从 tag 取（v1.2.3 → 1.2.3），不硬编码 —— 硬编码的版本号早晚
# 会和实际发布对不上，而那种不一致排查起来很费时间。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 手动触发时的版本号（如 1.2.3）
        required: true

permissions:
  contents: write   # 创建 Release 需要

jobs:
  release:
    name: 构建并发布
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # 打 tag 发布必须拿完整历史，否则版本号推导和子模块都不可靠
          fetch-depth: 0

      - name: 推导版本号
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          # 版本号会进包名，必须校验 —— 免得一个畸形 tag 打出乱码文件名。
          #
          # 允许 -rc<N> / -beta<N> 后缀：下面 prerelease: 的判断就认这两种，
          # 之前这里却只收纯 X.Y.Z，等于「声明支持预发布」但一打
          # v1.1.0-rc1 就被这步 exit 1 拦掉，两处自相矛盾。
          #
          # base 是去掉预发布后缀的部分，给包名和校验回读用：nfpm 的
          # semver schema 自己会把 1.1.0-rc1 折成 Version=1.1.0 +
          # Prerelease=rc1，deb 侧落成 1.1.0~rc1，版本序正好排在
          # 1.1.0 前面，不会出现「rc 比正式版新」。
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta)[0-9]*)?$' || {
            echo "::error::版本号不合法: '$V'（应形如 1.2.3 或 1.2.3-rc1）"
            exit 1
          }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "base=${V%%-*}" >> "$GITHUB_OUTPUT"
          echo "构建版本 $V"

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            valac libgtk-3-dev libjson-glib-dev \
            squashfs-tools desktop-file-utils

      - name: 编译
        run: |
          make 2>&1 | tee build.log
          test "$(grep -c 'error:' build.log)" -eq 0 || {
            grep -B2 -A4 'error:' build.log | head -60
            exit 1
          }

      - name: 引擎自测（发布前必须全绿）
        run: |
          tests/make-fixtures.sh
          make selftest

      # ── AppImage runtime ──────────────────────────────────────────
      #
      # runtime 不是本项目构建的产物 —— 它是 AppImageKit 的启动器，
      # AppImage 格式本身就是「ELF runtime ++ squashfs」。AppImage 只负责
      # 挂载并执行里面的 AppRun，程序和数据都在后面那段 squashfs 里。
      #
      # 它必须从 AppImageKit 官方仓库取。这里没有走 scripts/make-appimage.sh
      # 的自动提取路径（那条要从本机现成的 AppImage 里截，CI 上没有），
      # 而是直接把下载的官方 runtime 通过 $RUNTIME 环境变量交给脚本 ——
      # 脚本支持这个入口，优先级最高。
      - name: 下载 AppImage runtime
        id: runtime
        run: |
          set -euo pipefail
          URL=https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64
          mkdir -p runtime
          curl -fsSL --retry 3 -o runtime/appimage-runtime-x86_64 "$URL"
          chmod +x runtime/appimage-runtime-x86_64

          SZ=$(stat -c%s runtime/appimage-runtime-x86_64)
          echo "下载到 $SZ 字节"
          test "$SZ" -ge 10240 || {
            echo "::error::runtime 体积异常（$SZ 字节），多半是下载到了错误页面"
            exit 1
          }
          file runtime/appimage-runtime-x86_64 | grep -q ELF || {
            echo "::error::runtime 不是 ELF"
            exit 1
          }
          # 脚本自己还会做一次往返校验（自报偏移 + --appimage-extract），
          # 这里只做最基础的体积与格式检查，失败信息更直白。

      - name: 打包 AppImage
        env:
          RUNTIME: ${{ github.workspace }}/runtime/appimage-runtime-x86_64
        run: |
          set -euo pipefail
          bash scripts/make-appimage.sh
          ls -la dist/

      - name: 验证 AppImage 真的能用
        # 「构建成功」不等于「产物能用」。这里实际解包一次，
        # 确认 layout 完整、二进制可执行、桌面文件合法。
        run: |
          set -euo pipefail
          AI=$(ls dist/*.AppImage | head -1)
          echo "验证 $AI"

          rm -rf /tmp/aicheck && mkdir -p /tmp/aicheck && cd /tmp/aicheck
          "$OLDPWD/$AI" --appimage-extract
          test -x squashfs-root/AppRun || { echo "::error::AppRun 不可执行"; exit 1; }
          test -x squashfs-root/usr/bin/appimage-manager || {
            echo "::error::内嵌二进制不可执行"; exit 1; }
          test -f squashfs-root/usr/share/appimage-manager/style.css || {
            echo "::error::style.css 缺失（会渲染成无样式界面）"; exit 1; }
          test -f squashfs-root/appimage-manager.desktop || {
            echo "::error::.desktop 缺失"; exit 1; }
          desktop-file-validate squashfs-root/appimage-manager.desktop \
            || echo "::warning::内嵌 .desktop 未通过校验"

      # ── 免 root 的 tar.gz ────────────────────────────────────────
      #
      # deb/rpm/arch 包都需要 root 才能装进系统目录，但很多人只想
      # 解压了直接跑。这个包给那部分用户。
      - name: 打 tar.gz
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          STAGE="dist/appimage-manager-$V-linux-x86_64"
          rm -rf "$STAGE"
          # 前缀统一成 appimage-manager/，解包后不会把文件散在当前目录
          make install DESTDIR="$STAGE" PREFIX=/usr >/dev/null
          tar -czf "dist/appimage-manager-$V-linux-x86_64.tar.gz" \
              -C "$STAGE" usr
          echo "已附带运行说明"
          # 运行说明写成**独立资产**，不塞进 tar 包，也不写进那个已经被
          # tar 掉的暂存目录 ——
          #   写进暂存目录：tar 已经打完了，写进去也没人看得到；
          #   塞进 tar 包：会破坏包内 usr/ 前缀的干净结构。
          # 之前正是写在暂存目录里，内容还自称「需要从 Release 页面单独
          # 下载」，而 files: 列表里根本没有它 —— 永远发不出去。
          cat > "dist/README-install.txt" <<EOF
          AppImage Manager $V （免安装版）

          解压后直接运行，不需要 root：

              tar xzf appimage-manager-$V-linux-x86_64.tar.gz
              ./appimage-manager-$V-linux-x86_64/usr/bin/appimage-manager

          依赖：需要已安装 GTK3（桌面发行版基本都有）。
          检查：ldd ./appimage-manager | grep 'not found'

          想让它出现在应用菜单里：

              install -Dm644 ./appimage-manager-$V-linux-x86_64/usr/share/applications/appimage-manager.desktop \\
                ~/.local/share/applications/appimage-manager.desktop
              install -Dm644 ./appimage-manager-$V-linux-x86_64/usr/share/icons/hicolor/256x256/apps/appimage-manager.png \\
                ~/.local/share/icons/hicolor/256x256/apps/

          EOF
          ls -la dist/

      # ── deb / rpm / arch ────────────────────────────────────────
      # ── 源码包 ──────────────────────────────────────────────────
      #
      # GPL-3.0 要求分发二进制时同时提供对应源码。GitHub 每个 Release 会
      # 自动附 Source code (zip/tar.gz)，但那是 GitHub 的自动行为，
      # 文件名跟着 tag 走、内容也把截图和 CI 配置一并打包（反正有整棵仓库）。
      # 这里另外给一份规范的 src.tar.gz：
      #   · 固定命名 appimage-manager-<版本>-src.tar.gz，发行版打包脚本
      #     （debian/watch 之类）能直接按名字取
      #   · 用 .gitattributes 的 export-ignore 排掉 docs/（740KB 截图）、
      #     .github/、.gitignore —— 只留能编译的最小集合
      #   · 打完真的解开编译一遍：源码包最没意义的失败就是「解出来编不过」
      - name: 打源码包并验证能编译
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          git archive --format=tar.gz \
              --prefix="appimage-manager-$V/" \
              -o "dist/appimage-manager-$V-src.tar.gz" HEAD
          ls -la "dist/appimage-manager-$V-src.tar.gz"

          rm -rf /tmp/srccheck && mkdir -p /tmp/srccheck
          tar xzf "dist/appimage-manager-$V-src.tar.gz" -C /tmp/srccheck
          D="/tmp/srccheck/appimage-manager-$V"

          for f in Makefile LICENSE src/version.vala data/style.css \
                   packaging/nfpm.yaml scripts/make-appimage.sh \
                   tests/selftest.vala tests/make-fixtures.sh; do
            test -e "$D/$f" || { echo "::error::源码包缺 $f"; exit 1; }
          done

          # 截图和 CI 配置不该进来 —— export-ignore 万一被谁删掉，这里立刻响
          test ! -d "$D/docs"    || { echo "::error::源码包里带上了 docs/（截图撑体积）"; exit 1; }
          test ! -d "$D/.github" || { echo "::error::源码包里带上了 .github/"; exit 1; }

          # 真编译一遍
          make -C "$D" 2>&1 | tail -5
          test -x "$D/appimage-manager" || {
            echo "::error::源码包编译不出二进制"; exit 1; }
          echo "源码包校验通过（$D）"

      - name: 安装 nfpm
        run: |
          set -euo pipefail

          # nfpm 只发布在 GitHub Releases 上，没有 apt 包。
          #
          # URL 里的大小写是有讲究的：资产名是 nfpm_<版本>_Linux_x86_64.tar.gz
          # （大写 L、大写 X）。老工作流用的是
          #   https://nfpm.goreleaser.com/static/nfpm-2.41.0_linux_amd64.tar.gz
          # 那个 GoReleaser static 托管早就下线了，现在返回 404 的 HTML 页面。
          #
          # 所以下面第一件事是给 curl 加 -f（遇 4xx/5xx 直接失败）。
          # 少了它，404 的 HTML 会顺着管道喂给 tar，报出来的是
          # 「gzip: stdin: not in gzip format」——指错方向的错误信息，
          # 真正的原因（URL 404 了）反而看不见。
          V=2.47.0
          URL="https://github.com/goreleaser/nfpm/releases/download/v${V}/nfpm_${V}_Linux_x86_64.tar.gz"
          curl -fsSL -o /tmp/nfpm.tar.gz "$URL"

          # 解压前先确认拿到的是 gzip。URL 万一再变，这里能立刻说清原因，
          # 而不是让失败出现在后面几步的打包命令里。
          file /tmp/nfpm.tar.gz | grep -q 'gzip compressed data' || {
            echo "::error::下载到的不是 gzip，URL 可能又变了：$URL"
            head -c 200 /tmp/nfpm.tar.gz
            exit 1
          }

          tar xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          chmod +x /tmp/nfpm
          # 真跑一次：架构不对、解出来是个空壳，都在这里拦住
          /tmp/nfpm --version

      # 暂存安装树。**必须在仓库根跑** —— packaging/ 里没有 Makefile，
      # 在那跑 make install 只会报 "No rule to make target 'install'" 然后空转，
      # 后面 nfpm 会因为找不到 ../build/pkg/... 而失败。
      - name: 暂存安装树（替换 @PREFIX@）
        # .desktop 里有 @PREFIX@ 占位符要由 sed 替换，而 nfpm 不做替换，
        # 所以先 make install 出一份替换好的暂存树给 nfpm 吃。
        run: make install DESTDIR=build/pkg PREFIX=/usr

      - name: 打 deb / rpm / arch 包
        working-directory: packaging
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          OUT="${{ github.workspace }}/dist"
          mkdir -p "$OUT"

          # 注意工作目录是 packaging/：nfpm.yaml 的 contents.src 与
          # scripts.* 都相对当前工作目录解析。

          # ── 版本号必须来自 tag ──────────────────────────────────
          #
          # nfpm 既没有 --version 参数，配置里也不支持 {{ .Version }} 模板，
          # packaging/nfpm.yaml 里的 version 只能写死。所以这里生成一份
          # 临时配置，把 version 换成这次 tag 的值 ——
          # 不然打 v1.1.0 的 tag，deb/rpm/arch 包里标的还是 1.0.0。
          # （那个文件里甚至留了这段做法的注释，但工作流一直没实现。）
          sed "s|^version: .*|version: $V|" nfpm.yaml > ../build/nfpm-ci.yaml
          grep -n '^version:' ../build/nfpm-ci.yaml

          # 注意是 archlinux 不是 arch —— nfpm 的 packager 名字如此，
          # 写 arch 会直接报 "no packager registered for the format arch"
          for f in deb rpm archlinux; do
            echo "── $f ──"
            /tmp/nfpm package --config ../build/nfpm-ci.yaml \
              --packager "$f" --target "$OUT"
          done
          ls -la "$OUT"

      - name: 断言包里的版本号与 tag 一致
        # 光「改对了」不够 —— 得从打好的包里**读回来**核对。
        # 这类错一旦溜出去就是「用户装到的包自称是旧版本」，
        # 事后排查代价极高，而这里几行就能拦住。
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          # 预发布后缀在 deb 里落成 ~rc1（1.1.0~rc1），比对时统一成 base
          BASE="${{ steps.ver.outputs.base }}"
          fail=0

          DEB=$(ls dist/*.deb | head -1)
          DV=$(dpkg-deb -f "$DEB" Version)
          echo "deb  版本: $DV  （期望以 $BASE 开头）"
          case "$DV" in "$BASE"*) ;; *) echo "::error::$DEB 版本是 $DV，与 tag $V 不符"; fail=1;; esac

          RPMF=$(ls dist/*.rpm | head -1)
          RV=$(rpm -qp --qf '%{VERSION}' "$RPMF" 2>/dev/null \
               || rpm -qp --queryformat '%{VERSION}' "$RPMF" 2>/dev/null || echo "?")
          echo "rpm  版本: $RV  （期望以 $BASE 开头）"
          case "$RV" in "$BASE"*) ;; *) echo "::error::$RPMF 版本是 $RV，与 tag $V 不符"; fail=1;; esac

          # Arch 包的版本在 .PKGINFO 里，比 rpm 好读也更好校验
          ARCHF=$(ls dist/*.pkg.tar.zst | head -1)
          AV=$(tar --zstd -xOf "$ARCHF" .PKGINFO 2>/dev/null \
               | sed -n 's/^pkgver *= *//p' | head -1)
          echo "arch 版本: $AV  （期望以 $BASE 开头）"
          case "$AV" in "$BASE"*) ;; *) echo "::error::$ARCHF 版本是 $AV，与 tag $V 不符"; fail=1;; esac

          [ "$fail" -eq 0 ] || exit 1
          echo "三个包的版本号都与 tag $V 一致"

      - name: 校验 deb 包结构与依赖
        # 包能打出来不代表能用。这里实际解开看一眼：文件齐不齐、
        # 依赖声明对不对。依赖名写错（比如 deb 上写成 rpm 的名字）
        # 是这类打包最容易犯、也最难在事后发现的错。
        run: |
          set -euo pipefail
          V="${{ steps.ver.outputs.version }}"
          DEB=$(ls dist/*_${V}_amd64.deb 2>/dev/null | head -1 || ls dist/*.deb | head -1)
          echo "检查 $DEB"
          dpkg-deb --info "$DEB" | sed -n '1,20p'
          echo "── Depends ──"
          dpkg-deb -f "$DEB" Depends
          echo "── 内容清单 ──"
          dpkg-deb --contents "$DEB" | awk '{print $6}' | grep -v '/$'
          rm -rf /tmp/debcheck && mkdir -p /tmp/debcheck
          dpkg-deb -x "$DEB" /tmp/debcheck
          test -x /tmp/debcheck/usr/bin/appimage-manager || {
            echo "::error::deb 里没有可执行的二进制"; exit 1; }
          test -f /tmp/debcheck/usr/share/appimage-manager/style.css || {
            echo "::error::deb 里没有 style.css"; exit 1; }
          test -f /tmp/debcheck/usr/share/applications/appimage-manager.desktop || {
            echo "::error::deb 里没有 .desktop"; exit 1; }
          # 二进制的动态库必须都能在 deb 的 Depends 里找到对应项
          for lib in $(ldd /tmp/debcheck/usr/bin/appimage-manager \
                       | awk '/=> \//{print $1}'); do
            case "$lib" in
              # 新版 Debian/Ubuntu（trixie 及以后）改用 t64 后缀的包名，
              # 老版本仍是无后缀的。配置里写成 "A | B" 兼容两者，
              # 所以这里任一命中即通过。
              libgtk-3.so.0)      need='libgtk-3-0t64|libgtk-3-0' ;;
              libglib-2.0.so.0)   need='libglib2.0-0t64|libglib2.0-0' ;;
              libjson-glib-1.0.so.0) need=libjson-glib-1.0-0 ;;
              *) need="" ;;
            esac
            [ -z "$need" ] && continue
            # need 里可能是 "A|B"（新旧包名），任一命中即可
            found=1
            IFS='|' read -ra alts <<< "$need"
            for alt in "${alts[@]}"; do
              dpkg-deb -f "$DEB" Depends | grep -q "$alt" && { found=0; break; }
            done
            [ "$found" -eq 0 ] || {
              echo "::error::deb Depends 缺 $need（$lib 需要它）"; exit 1; }
          done
          echo "deb 结构与依赖校验通过"

      - name: 生成 SHA256SUMS
        # 校验和原先是嵌在 Release 说明的代码块里的，脚本没法直接下载核对。
        # 做成独立资产，`sha256sum -c SHA256SUMS` 就能验全部。
        run: |
          set -euo pipefail
          cd dist
          # 排除自身，也排除那个给人看的说明文件
          rm -f SHA256SUMS
          sha256sum *.AppImage *.tar.gz *.deb *.rpm *.pkg.tar.zst \
            > SHA256SUMS
          cat SHA256SUMS

      - name: 收集产物
        id: artifacts
        run: |
          set -euo pipefail
          cd dist
          # README-install.txt 和 SHA256SUMS 单独放 —— 它们是给人看的
          # 说明与校验数据，不属于可执行内容，塞进 tar 包里反而会挡住
          # usr/ 前缀的干净结构。
          #
          # 用显式清单而不是再 glob 一次：漏掉任何一项都是「资产少了但
          # Release 看着正常」这种最难发现的错。
          ls -1 *.AppImage *.tar.gz *.deb *.rpm *.pkg.tar.zst \
                SHA256SUMS README-install.txt > /tmp/artifact_list
          sort -o /tmp/artifact_list /tmp/artifact_list
          cat /tmp/artifact_list | sed 's/^/  /'
          echo "count=$(wc -l < /tmp/artifact_list)" >> "$GITHUB_OUTPUT"

      - name: 生成 Release 说明
        run: |
          V="${{ steps.ver.outputs.version }}"
          {
            echo "AppImage Manager $V"
            echo
            echo "扫描指定目录里的 AppImage，把它们变成规范的桌面启动器，"
            echo "并持续维护这些启动器的健康状态。"
            echo
            echo "## 下载"
            echo
            echo "| 文件 | 适合谁 |"
            echo "|---|---|"
            echo "| \`AppImage-Manager-$V-x86_64.AppImage\` | 免安装，赋可执行权限后双击即用 |"
            echo "| \`appimage-manager-$V-linux-x86_64.tar.gz\` | 想免安装又要能进应用菜单 |"
            # deb 的文件名带 nfpm 的 release 字段（nfpm.yaml 里的 release:），
            # 实际是 appimage-manager_1.0.0-1_amd64.deb，不是 ..._1.0.0_amd64.deb。
            # 写成后者的话用户按说明找不到文件。
            echo "| \`appimage-manager_$V-1_amd64.deb\` | Debian / Ubuntu / Kali / Mint |"
            echo "| \`appimage-manager-$V-1.x86_64.rpm\` | Fedora / RHEL / openSUSE |"
            echo "| \`appimage-manager-$V-1-x86_64.pkg.tar.zst\` | Arch / Manjaro |"
            echo "| \`appimage-manager-$V-src.tar.gz\` | 源码（发行版打包者用） |"
            echo
            echo "另有 \`SHA256SUMS\`（校验和，\`sha256sum -c SHA256SUMS\` 可验全部）"
            echo "和 \`README-install.txt\`（tar.gz 版的用法说明）。"
            echo
            echo "原生二进制与 AppImage 都**依赖系统的 GTK3**（桌面发行版基本都有）。"
            echo "用 deb/rpm/arch 包时依赖会自动被声明并装好。"
            echo
            echo "## 校验"
            echo
            echo "每个包都对应源码 \`$GITHUB_SHA\`："
            echo
            echo '```'
            echo "git clone $GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
            echo "cd $GITHUB_REPOSITORY && git checkout $GITHUB_SHA"
            echo '```'
            echo
            echo "SHA256：见附件 `SHA256SUMS`（或展开下面的代码块）"
            echo
            echo '```'
            cd dist && cat SHA256SUMS 2>/dev/null || true
            echo '```'
          } > "${{ github.workspace }}/RELEASE_NOTES.md"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.ver.outputs.version }}"
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            dist/*.AppImage
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/SHA256SUMS
            dist/README-install.txt
          fail_on_unmatched_files: true